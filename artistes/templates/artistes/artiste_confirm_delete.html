<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer {{ object }}</title>
</head>
<body>
    <h1>Supprimer {{ object }} ?</h1>
    <p>Êtes-vous sûr de vouloir supprimer cet artiste ?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Oui, supprimer</button>
        <a href="{% url 'artistes:detail' object.pk %}">Annuler</a>
    </form>
</body>
</html>
